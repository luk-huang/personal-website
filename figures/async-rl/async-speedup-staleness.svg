<g class="point animated" stroke="#7a6870" stroke-width="2" stroke-linecap="round"><title>Policy Lag K=∞ (Training-Bound), 2048 cap: 68.2s, ok</title><line x1="128.1" y1="450.5" x2="138.5" y2="460.9"/><line x1="128.1" y1="460.9" x2="138.5" y2="450.5"/></g>
<g class="point animated" stroke="#7a6870" stroke-width="2" stroke-linecap="round"><title>Policy Lag K=∞ (Training-Bound), 4096 cap: 88.2s, ok</title><line x1="175.7" y1="446.8" x2="186.1" y2="457.2"/><line x1="175.7" y1="457.2" x2="186.1" y2="446.8"/></g>
<g class="point animated" stroke="#7a6870" stroke-width="2" stroke-linecap="round"><title>Policy Lag K=∞ (Training-Bound), 8192 cap: 141.2s, ok</title><line x1="269.5" y1="437.2" x2="279.9" y2="447.6"/><line x1="269.5" y1="447.6" x2="279.9" y2="437.2"/></g>
<g class="point animated" stroke="#7a6870" stroke-width="2" stroke-linecap="round"><title>Policy Lag K=∞ (Training-Bound), 16384 cap: 274.4s, ok</title><line x1="444.9" y1="413.2" x2="455.3" y2="423.6"/><line x1="444.9" y1="423.6" x2="455.3" y2="413.2"/></g>
<g class="point animated" stroke="#7a6870" stroke-width="2" stroke-linecap="round"><title>Policy Lag K=∞ (Training-Bound), 24576 cap: 577.2s, ok</title><line x1="605.0" y1="358.3" x2="615.4" y2="368.7"/><line x1="605.0" y1="368.7" x2="615.4" y2="358.3"/></g>
<text class="direct-label" x="628" y="112" fill="#111111">Synchronous / Rollout-Bound</text>
<text class="direct-label" x="618" y="256" fill="#598be7">Policy Lag K=4</text>
<text class="direct-label" x="625" y="376" fill="#7a6870">Policy Lag K=∞ (Training-Bound)</text>
