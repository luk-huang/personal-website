<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
<title id="title">Async RL Time per Step by Context and Policy Lag</title>
<desc id="desc">Line chart comparing time per step for policy lag K=0, K=4, and K infinity as average response length grows.</desc>
<style>
  svg { background: #fff; color: #111; font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif; }
  .title { font-size: 24px; font-weight: 650; fill: #111; }
  .subtitle, .tick, .legend-note { fill: #555; }
  .axis { fill: #111; font-weight: 600; }
  .subtitle { font-size: 13px; }
  .axis { font-size: 13px; }
  .tick { font-size: 11px; }
  .grid { stroke: #e8edf5; stroke-width: 1; }
  .axis-line { stroke: #111; stroke-width: 1; }
  .plot-line { fill: none; stroke-width: 2.7; stroke-linejoin: round; stroke-linecap: round; }
  .plot-line.dashed { stroke-dasharray: 7 7; }
  .point { opacity: 1; }
  .direct-label { font-size: 12.5px; font-weight: 650; }
  .legend-note { font-size: 12px; }
  .callout { fill: #2f3b4a; font-size: 12.5px; font-weight: 600; }
  .callout-soft { fill: #667085; font-size: 11.5px; }
</style>
<rect x="0.5" y="0.5" width="919" height="559" fill="#fff" stroke="#ececec"/>
<text class="title" x="34" y="42">Async RL Time per Step by Context and Policy Lag</text>
<rect x="82" y="88" width="590" height="380" fill="#ffffff"/>
<line class="grid" x1="82.0" y1="88" x2="82.0" y2="468"/>
<text class="tick" x="82.0" y="491" text-anchor="middle">0</text>
<line class="grid" x1="180.3" y1="88" x2="180.3" y2="468"/>
<text class="tick" x="180.3" y="491" text-anchor="middle">4k</text>
<line class="grid" x1="278.7" y1="88" x2="278.7" y2="468"/>
<text class="tick" x="278.7" y="491" text-anchor="middle">8k</text>
<line class="grid" x1="475.3" y1="88" x2="475.3" y2="468"/>
<text class="tick" x="475.3" y="491" text-anchor="middle">16k</text>
<line class="grid" x1="672.0" y1="88" x2="672.0" y2="468"/>
<text class="tick" x="672.0" y="491" text-anchor="middle">24k</text>
<line class="grid" x1="82" y1="468.0" x2="672" y2="468.0"/>
<text class="tick" x="72" y="472.0" text-anchor="end">0</text>
<line class="grid" x1="82" y1="377.5" x2="672" y2="377.5"/>
<text class="tick" x="72" y="381.5" text-anchor="end">500</text>
<line class="grid" x1="82" y1="287.0" x2="672" y2="287.0"/>
<text class="tick" x="72" y="291.0" text-anchor="end">1000</text>
<line class="grid" x1="82" y1="196.6" x2="672" y2="196.6"/>
<text class="tick" x="72" y="200.6" text-anchor="end">1500</text>
<line class="grid" x1="82" y1="106.1" x2="672" y2="106.1"/>
<text class="tick" x="72" y="110.1" text-anchor="end">2000</text>
<line class="axis-line" x1="82" y1="468" x2="672" y2="468"/>
<line class="axis-line" x1="82" y1="88" x2="82" y2="468"/>
<text class="axis" x="377.0" y="528" text-anchor="middle">Average response length (tokens)</text>
<text class="axis" transform="translate(24,278.0) rotate(-90)" text-anchor="middle">Time per Step (s) ↓</text>
<path class="plot-line animated" d="M133.2,444.8 L181.2,431.5 L272.9,372.6 L447.5,253.3 L618.5,113.4" stroke="#111111" style="--path-length:602; animation-delay:0.00s"/>
<circle class="point animated" cx="133.2" cy="444.8" r="4.8" fill="#111111"><title>Synchronous / Rollout-Bound, 2048 cap: 128.2s, ok</title></circle>
<circle class="point animated" cx="181.2" cy="431.5" r="4.8" fill="#111111"><title>Synchronous / Rollout-Bound, 4096 cap: 201.7s, ok</title></circle>
<circle class="point animated" cx="272.9" cy="372.6" r="4.8" fill="#111111"><title>Synchronous / Rollout-Bound, 8192 cap: 527.3s, ok</title></circle>
<circle class="point animated" cx="447.5" cy="253.3" r="4.8" fill="#111111"><title>Synchronous / Rollout-Bound, 16384 cap: 1186.5s, ok</title></circle>
