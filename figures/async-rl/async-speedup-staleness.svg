<circle class="point animated" cx="180.9" cy="440.7" r="4.8" fill="#598be7"><title>Policy Lag K=4, 4096 cap: 150.9s, ok</title></circle>
<circle class="point animated" cx="274.7" cy="425.6" r="4.8" fill="#598be7"><title>Policy Lag K=4, 8192 cap: 234.5s, ok</title></circle>
<circle class="point animated" cx="450.1" cy="345.6" r="4.8" fill="#598be7"><title>Policy Lag K=4, 16384 cap: 676.7s, ok</title></circle>
<circle class="point animated" cx="610.2" cy="244.8" r="4.8" fill="#598be7"><title>Policy Lag K=4, 24576 cap: 1233.3s, ok</title></circle>
